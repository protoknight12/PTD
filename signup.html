<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Critique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="signup.html" class="logo">Critique<span>.</span></a>
        <p class="nav-text">Your world of stories, sounds and cinema.</p>
    </header>

    <main class="container">
        <section class="signup-card">
            <h1>Create your account</h1>

            <p class="subtitle">
                Discover, explore and review movies, music and books.
            </p>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="terms">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the Terms of Service and Privacy Policy.
                    </label>
                </div>

                <button type="submit" class="signup-button">
                    Create Account
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <p class="login-text">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>
        </section>

        <footer>
            <p>© 2026 Critique. Made for entertaiment analysis.</p>
        </footer>
    </main>
</body>
</html>
